<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic-Tac-Toe Under the Stars</title>
  <meta name="description" content="Play tic-tac-toe against the computer on a rotating cube under a hand-painted night sky.">
  <meta name="theme-color" content="#0b1230">
  <link rel="preload" href="fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23142152'/><path d='M21 21L43 43M43 21L21 43' stroke='%23ff8fc8' stroke-width='6' stroke-linecap='round'/></svg>">
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <main class="game">
    <header class="game-heading">
      <h1>Tic-Tac-Toe</h1>
      <p class="tagline">Beat the computer under the stars</p>
    </header>

    <p class="score" aria-label="Score">
      <span class="score-side"><b class="mark-x" aria-hidden="true">✕</b> You <span class="score-value" id="score-x">0</span></span>
      <span class="score-divider" aria-hidden="true">:</span>
      <span class="score-side"><span class="score-value" id="score-o">0</span> Computer <b class="mark-o" aria-hidden="true">◯</b></span>
    </p>

    <div class="board-stage">
      <canvas id="game-canvas" aria-hidden="true"></canvas>
      <div id="board" class="board-grid" role="grid" aria-label="Game board" aria-describedby="board-help"></div>
    </div>

    <section class="controls" aria-label="Game controls">
      <p id="status-text" role="status" aria-atomic="true">Your turn</p>
      <button id="game-btn" class="primary-button" type="button">New game</button>
      <p id="board-help">Arrow keys choose a square · Enter or Space plays</p>
    </section>
  </main>

  <button id="sound-btn" class="icon-button" type="button" aria-pressed="false" aria-label="Sound" title="Sound">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>
      <path class="wave" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path class="mute" d="M15.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </button>

  <script type="module" src="game.js"></script>
</body>
</html>
